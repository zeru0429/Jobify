name: Deploy Express Project to CPanel
on:
  push:
    branches:
      - main # Deploy on push to the 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Specify the Node.js version

      # ========================== BACKEND BUILD ========================== #
      # Step 3: Install Backend Dependencies
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install --legacy-peer-deps

      # Step 4: Build Backend (TypeScript → JavaScript)
      - name: Build Backend
        run: |
          cd backend
          npm run build
        env:
          PORT: 5050
          MONGO_URI: mongodb+srv://zeru:whg8NE2ltiCMB4qI@hrms.ipb1k.mongodb.net/
          JWT_SECRET: mamaelij
          JWT_REFRESH_SECRET: your-super-secret-refresh-key
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          FRONTEND_URL: http://localhost:5173
          FRONTEND_URL_CORS: http://localhost:5173,http://localhost:3000,http://localhost:5173,http://192.168.43.69
          OPENAI_API_KEY: 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
          COOKIE_SECRET: tsehaymemartiwedalech
          CLEAR_EXISTING_DATA: true
          ACCESS_TOKEN_SECRET: supersecretaccesskey
          ACCESS_TOKEN_LIFE: 1h
          REFRESH_TOKEN_SECRET: supersecretrefreshkey
          REFRESH_TOKEN_LIFE: 7d
          INVITE_TOKEN_SECRET: supersecretinvitekey
          INVITE_TOKEN_LIFE: 3d

      # Step 5: Archive Backend Build Folder (Excluding node_modules)
      - name: Archive Backend Build Folder
        run: |
          cd backend
          tar --exclude='node_modules' -czf ../backend.tar.gz -C dist .

      # ========================== DEPLOYMENT ========================== #
      # Step 6: Deploy Backend via SSH
      - name: Deploy Backend via SSH
        env:
          SSH_USERNAME: ${{ secrets.VPS_USERNAME }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT }}
          REMOTE_PATH: ${{ secrets.VPS_REMOTE_PATH }}
        run: |
          # Ensure the SSH key is available
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

          # Transfer backend build to server
          scp -i private_key.pem -P "$SSH_PORT" -o StrictHostKeyChecking=no backend.tar.gz $SSH_USERNAME@$SSH_HOST:$REMOTE_PATH

          # Extract backend files and restart application
          ssh -i private_key.pem -p "$SSH_PORT" -o StrictHostKeyChecking=no $SSH_USERNAME@$SSH_HOST "
            set -e
            cd $REMOTE_PATH
            
            # Backup node_modules if it exists
            if [ -d 'node_modules' ]; then
              echo 'Backing up node_modules...'
              rm -rf node_modules_backup 2>/dev/null || true
              mv node_modules node_modules_backup
            fi
            
            # Remove existing files (except potential node_modules_backup)
            find . -maxdepth 1 ! -name '.' ! -name 'node_modules_backup' ! -name '..' -exec rm -rf {} + 2>/dev/null || true
            
            # Extract new files
            echo 'Extracting new build...'
            tar -xzf backend.tar.gz -C . --overwrite
            
            # Restore or install node_modules
            if [ -d 'node_modules_backup' ]; then
              echo 'Restoring node_modules...'
              rm -rf node_modules 2>/dev/null || true
              mv node_modules_backup node_modules
            else
              echo 'Installing production dependencies...'
              npm install --production
            fi
            
            # Create .env file with all environment variables
            cat > .env << 'ENV_EOF'
            PORT=5050
            MONGO_URI=mongodb+srv://zeru:whg8NE2ltiCMB4qI@hrms.ipb1k.mongodb.net/
            NODE_ENV=development
            JWT_SECRET=mamaelij
            JWT_REFRESH_SECRET=your-super-secret-refresh-key
            JWT_EXPIRES_IN=15m
            JWT_REFRESH_EXPIRES_IN=7d
            FRONTEND_URL=http://localhost:5173
            FRONTEND_URL_CORS=http://localhost:5173,http://localhost:3000,http://localhost:5173,http://192.168.43.69
            OPENAI_API_KEY=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
            COOKIE_SECRET=tsehaymemartiwedalech
            CLEAR_EXISTING_DATA=true
            ACCESS_TOKEN_SECRET=supersecretaccesskey
            ACCESS_TOKEN_LIFE=1h
            REFRESH_TOKEN_SECRET=supersecretrefreshkey
            REFRESH_TOKEN_LIFE=7d
            INVITE_TOKEN_SECRET=supersecretinvitekey
            INVITE_TOKEN_LIFE=3d
            ENV_EOF

            # Restart application with PM2
            echo 'Restarting application...'
            pm2 delete express-app 2>/dev/null || true
            if [ -f 'server.js' ]; then
              pm2 start server.js --name express-app
            elif [ -f 'dist/server.js' ]; then
              pm2 start dist/server.js --name express-app
            elif [ -f 'app.js' ]; then
              pm2 start app.js --name express-app
            else
              echo 'Error: Could not find main application file (server.js, dist/server.js, or app.js)'
              exit 1
            fi
            pm2 save
            pm2 list
          "

          # Clean up the private key
          rm -f private_key.pem

      # Step 7: Verify Deployment
      - name: Verify Deployment
        env:
          SSH_USERNAME: ${{ secrets.VPS_USERNAME }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT }}
          REMOTE_PATH: ${{ secrets.VPS_REMOTE_PATH }}
        run: |
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

          ssh -i private_key.pem -p "$SSH_PORT" -o StrictHostKeyChecking=no $SSH_USERNAME@$SSH_HOST "
            cd $REMOTE_PATH
            echo '=== PM2 Status ==='
            pm2 list
            echo '=== Application Logs (last 10 lines) ==='
            pm2 logs express-app --lines 10 --nostream || echo 'Logs not available yet'
          "

          rm -f private_key.pem
